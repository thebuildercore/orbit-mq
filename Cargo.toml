[workspace]
resolver = "2"

members = [
    "crates/orbit-core",
    "crates/orbit-storage",
    "crates/orbit-priority",
    "crates/orbit-ingress",
    "crates/orbit-uplink",
    "crates/orbit-broker"
, "crates/orbit-client"]

[workspace.dependencies]
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
memmap2 = "0.9.0"
crossbeam-channel = "0.5.12"
